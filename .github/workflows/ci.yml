name: Halle prüfen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: halle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Ende-zu-Ende
        run: npm run e2e
