name: Halle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    name: Typen und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: Ende-zu-Ende
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm run e2e

      - name: Spuren sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-spuren
          path: |
            test-results
            playwright-report
          retention-days: 7

  veroeffentlichen:
    name: Veröffentlichen
    needs: [bauen, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Geheimnisse prüfen
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID oder VERCEL_PROJECT_ID fehlt. Deployment übersprungen."
          fi

      - name: Code holen
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Node 22
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Vercel vorbereiten
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes vercel@56.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Nach Vercel
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes vercel@56.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
