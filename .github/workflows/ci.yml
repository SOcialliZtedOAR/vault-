name: Halle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    name: Typen und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Build
        run: npm run build

  geheimnisse:
    name: Geheimnisse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      - name: TruffleHog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.1/trufflehog_3.100.1_linux_amd64.tar.gz | tar -xz trufflehog
          ./trufflehog git file://. --no-update --fail --github-actions --results=verified,unknown,unverified

  e2e:
    name: Ende-zu-Ende
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm run e2e

      - name: Spuren sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-spuren
          path: |
            test-results
            playwright-report
          retention-days: 7

  veroeffentlichen:
    name: Veröffentlichen
    needs: [bauen, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Geheimnisse prüfen
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN oder die Projekt-Variablen fehlen. Deployment übersprungen."
          fi

      - name: Code holen
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Node 22
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Vercel vorbereiten
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.1.0 pull --yes --environment=production

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Nach Vercel
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.1.0 deploy --prebuilt --prod
